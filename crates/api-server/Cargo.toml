[package]
name = "api-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
bcrypt = "0.18.0"
chrono = "0.4"
futures-util = "0.3.31"
jsonwebtoken = "9"
redis = { version = "1.0.2", features = ["tokio-comp"] }
rust_decimal = "1.40.0"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
shared = { path = "../shared" }
sqlx = "0.8.6"
tokio = {version = "1.49.0", features = ["full"]}
tokio-tungstenite = "0.28.0"
tower-http = {version = "0.6.8", features = ["cors"]}
