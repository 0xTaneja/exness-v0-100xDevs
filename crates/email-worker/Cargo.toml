[package]
name = "email-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
redis = { version = "1.0.2", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json"] }
shared = { path = "../shared" }
sqlx = "0.8.6"
