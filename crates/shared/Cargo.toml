[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = {version = "0.4.4", features = ["serde"]} 
redis = {version = "1.0.2", features = ["tokio-comp"]} 
rust_decimal = {version = "1.40.0", features = ["db-postgres", "serde-with-str"]}

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = {version = "0.8.6", features = ["runtime-tokio","postgres","uuid","macros","chrono","rust_decimal"]}
uuid = { version = "1", features = ["serde"] }