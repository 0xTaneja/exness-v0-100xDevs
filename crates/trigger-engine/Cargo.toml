[package]
name = "trigger-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = "1.40.0"
sqlx = "0.8.6"
futures-util = "0.3.31"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = {version = "1.49.0", features = ["full"]}
tokio-tungstenite =  {version = "0.28.0", features = ["native-tls"]}
tungstenite = "0.28.0"
shared = {path = "../shared"}
redis = { version = "1.0.2", features = ["tokio-comp"] }